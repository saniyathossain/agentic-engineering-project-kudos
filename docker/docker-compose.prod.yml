# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  (or `make prod`)
# Immutable images, no bind mounts, non-root, read-only rootfs, dropped capabilities, resource caps,
# loopback-only published port (put a TLS proxy / load balancer in front), no vite, no Postgres port.
# Secrets live in docker/.envs/app.prod.env (git-ignored); see app.prod.env.example.
x-prod: &prod
  image: ${KUDOS_IMAGE:-kudos-app:prod}
  build:
    context: ../
    dockerfile: docker/Dockerfile
    target: prod
  env_file: .envs/app.prod.env
  volumes: !override
    - storage:/app/storage
  read_only: true
  tmpfs:
    - /tmp
    - /app/bootstrap/cache:uid=82,gid=82,mode=0755   # config/route caches are built at boot from the container env
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: always
  logging:
    driver: local
    options: { max-size: 50m, max-file: "10" }

services:
  app:
    <<: *prod
    ports: !reset []
    environment: !override
      APP_ROLE: web
    expose: ["9000"]
    mem_limit: ${APP_MEM_LIMIT:-512m}
    memswap_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPUS:-1.5}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ${KUDOS_EDGE_IMAGE:-kudos-edge:prod}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: edge
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8080"
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128
    networks: [kudos-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  queue:
    <<: *prod
    environment: !override
      APP_ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2", "--max-time=3600"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *prod
    environment: !override
      APP_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64

  vite:
    profiles: ["disabled-in-prod"]

  mailpit:
    profiles: ["disabled-in-prod"]

  db:
    ports: !reset []
    env_file: .envs/app.prod.env
    environment: !override
      POSTGRES_DB: ${DB_DATABASE:-kudos}
    mem_limit: ${DB_MEM_LIMIT:-512m}
    memswap_limit: ${DB_MEM_LIMIT:-512m}
    cpus: ${DB_CPUS:-1.0}
    pids_limit: 200
    restart: always

volumes:
  storage: {}
