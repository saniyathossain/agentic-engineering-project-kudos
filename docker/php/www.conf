[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; the application writes its own JSON access log; fpm's duplicate line would break one-JSON-object-per-line
access.log = /dev/null
