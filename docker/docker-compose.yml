name: kudos

x-app: &app
  build:
    context: ../
    dockerfile: docker/Dockerfile
  volumes:
    - ../codes:/app
    - /app/vendor
    - /app/node_modules
    - ./.envs/app.env:/run/app.env:ro
  depends_on:
    db:
      condition: service_healthy
  networks:
    - kudos-net
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    environment:
      RUN_MIGRATIONS: "1"

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2"]

  vite:
    <<: *app
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm install; npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:${VITE_PORT:-5180}:5173"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kudos}
      POSTGRES_USER: ${DB_USERNAME:-kudos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kudos}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kudos} -d ${DB_DATABASE:-kudos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kudos-net

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8030}:8025"
    networks:
      - kudos-net

  stripe:
    image: stripe/stripe-cli:latest
    profiles: ["billing"]
    command: ["listen", "--api-key", "${STRIPE_SECRET:-}", "--forward-to", "http://app:8000/stripe/webhook"]
    networks:
      - kudos-net

networks:
  kudos-net:

volumes:
  db-data:
